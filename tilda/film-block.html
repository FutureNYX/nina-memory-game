<!-- ===========================================================
     NINA SECHKO x ROBINEAU - the film (vertical)

     PASTE ALL OF THIS INTO ONE TILDA BLOCK:
       Библиотека блоков -> Другое -> T123 "HTML-код"

     The film is NOT uploaded to Tilda, so Tilda's 5 MB ceiling
     does not apply to it. It streams from:
       https://futurenyx.github.io/nina-memory-game
     1080x1920 (34 MB) on a normal screen, 720x1280 (13 MB) on a narrow one,
     chosen automatically. Nothing downloads until the visitor
     presses play - scrolling past costs only the poster image.

     Worth knowing, near the top of the CSS:
       --ground                 background colour of this section
       --film-ar / --film-ar-num  shape of the film (9/16)
       --film-max-h / --film-max-w  how large it is allowed to get
     =========================================================== -->

<style>
/* let the block escape Tilda's 960px container */
.t-rec .t123__wrapper,.t123 .t-container,.t123 .t-col{max-width:100%!important;padding:0!important;margin:0!important}
/* ============================================================
   NINA SECHKO x ROBINEAU - the film
   Self-contained, namespaced under .nsxf.

   Nothing of the video downloads until someone presses play:
   preload="none" plus a poster image. So a 34 MB film costs a
   visitor who scrolls past exactly 47 KB.
   ============================================================ */
.nsxf *,.nsxf *::before,.nsxf *::after{box-sizing:border-box}
.nsxf{
  /* background of this section - match it to the block above or below */
  --ground:#ECEDF1;
  --ink:#16161A;
  --ink-soft:#5D5D68;

  --sans:"TildaSans","Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pad:clamp(20px,5.5vw,64px);

  /* Shape of the film. Both values describe the same ratio - the second
     is the first as a decimal, and they have to agree.
       vertical  9/16  -> 0.5625
       landscape 16/9  -> 1.7778   */
  --film-ar:9/16;
  --film-ar-num:0.5625;

  /* How large the film is allowed to get. Capped through the WIDTH, so
     the shape above is never broken and the picture is never trimmed. */
  --film-max-h:82svh;
  --film-max-w:1180px;

  font-family:var(--sans);
  color:var(--ink);
  background:var(--ground);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
.nsxf p{margin:0}
.nsxf video{display:block;max-width:100%}

.nsxf__inner{
  padding:clamp(56px,10vw,120px) var(--pad);
  margin-inline:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(18px,3vw,28px);
}

.nsxf__frame{
  position:relative;
  aspect-ratio:var(--film-ar);
  width:min(100%,var(--film-max-w),calc(var(--film-max-h) * var(--film-ar-num)));
  border-radius:14px;
  overflow:hidden;
  background:#000;
  box-shadow:0 1px 2px rgba(22,22,26,.06),0 30px 70px -40px rgba(22,22,26,.45);
}
.nsxf__frame video{
  width:100%;
  height:100%;
  /* contain so the whole frame is always visible, never trimmed */
  object-fit:contain;
  background:#000;
}

/* ---- play button ---- */
.nsxf__play{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  transition:opacity .3s ease;
}
.nsxf__play[hidden]{display:none}
.nsxf__playDot{
  width:clamp(64px,16vw,92px);
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  display:grid;
  place-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),background-color .22s;
}
.nsxf__play:hover .nsxf__playDot{transform:scale(1.06);background:#fff}
.nsxf__play:active .nsxf__playDot{transform:scale(.97)}
.nsxf__play:focus-visible{outline:3px solid #D9674F;outline-offset:4px;border-radius:14px}
.nsxf__playDot svg{width:36%;height:36%;margin-left:12%;fill:#16161A}

.nsxf__caption{
  font-size:clamp(13px,3vw,15px);
  line-height:1.5;
  color:var(--ink-soft);
  text-align:center;
  max-width:44ch;
}

@media (prefers-reduced-motion:reduce){
  .nsxf__playDot{transition:none}
}
</style>

<div class="nsxf">
  <div class="nsxf__inner">

    <div class="nsxf__frame">
      <video
        poster="https://futurenyx.github.io/nina-memory-game/media/film-poster.webp"
        preload="none"
        playsinline
        controls
        data-src-hi="https://futurenyx.github.io/nina-memory-game/media/film.mp4"
        data-src-lo="https://futurenyx.github.io/nina-memory-game/media/film-720.mp4"
        aria-label="Фильм об игре МЕМО"></video>

      <button class="nsxf__play" type="button" aria-label="Смотреть фильм">
        <span class="nsxf__playDot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </button>
    </div>

    <!-- delete this line if you would rather have no caption -->
    <p class="nsxf__caption">Фильм со звуком &mdash; 43 секунды</p>

  </div>
</div>


<script>
(function () {
  'use strict';
  var wraps = document.querySelectorAll('.nsxf');
  Array.prototype.forEach.call(wraps, function (wrap) {
    var v = wrap.querySelector('video');
    var btn = wrap.querySelector('.nsxf__play');
    if (!v || !btn || v.src) return;

    /* Pick a file once, at load. Narrow screens and data-saver get the
       small one. preload is "none", so choosing a source costs nothing
       until play is actually pressed. */
    var conn = navigator.connection || {};
    var small = Math.min(screen.width, screen.height) < 500;
    v.src = (conn.saveData || small)
      ? v.getAttribute('data-src-lo')
      : v.getAttribute('data-src-hi');

    btn.addEventListener('click', function () {
      btn.hidden = true;
      var q = v.play();
      if (q && q.catch) q.catch(function () { btn.hidden = false; });
    });
    v.addEventListener('ended', function () { btn.hidden = false; });
    v.addEventListener('pause', function () {
      if (v.currentTime > 0 && !v.ended && v.currentTime < v.duration) return;
      btn.hidden = false;
    });
  });
})();
</script>
