<div class="nsxp">
  <div class="nsxp__inner">

    <div class="nsxp__film">
      <video
        src="{{BASE}}/media/play.mp4"
        poster="{{BASE}}/media/still-spread.webp"
        muted playsinline loop preload="metadata"
        disablepictureinpicture
        aria-label="Карты разложены и разыгрываются как игра на память"></video>
    </div>

    <div class="nsxp__copy">
      <p class="nsxp__eyebrow">Как играть</p>
      <h2 class="nsxp__h2">Переверните две.<br>Найдите пару.</h2>
      <p class="nsxp__body">
        Разложите карты рубашкой вверх. Переворачивайте по две за ход. Совпала
        картина со своей парой &mdash; пара ваша. От двух до шести игроков, десять
        минут на партию, читать не нужно &mdash; поэтому это в равной мере детская
        игра и предмет коллекционера.
      </p>
    </div>

  </div>
</div>
